name: Pirouette pour Mac et Windows

# Fabrique les .dmg (Apple Silicon et Intel) sur des Mac GitHub et l'installateur Windows sur un PC GitHub,
# les teste, puis publie la page de téléchargement « Releases » avec des liens permanents.

on:
  push:
    branches: [main, claude/quiz-generator-app-l39aci]
    paths:
      - "app/**"
      - "desktop.py"
      - "packaging/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/macos-dmg.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    name: dmg (${{ matrix.label }})
    # Fabriqué et publié seulement sur le dépôt public (boopbipa/Pirouette), d'où l'app télécharge ses mises à jour.
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14        # Apple Silicon (M1, M2, M3…)
            label: Apple-Silicon
          - runner: macos-15-intel  # anciens Mac à processeur Intel
            label: Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt pytest

      - name: Tests
        run: python -m pytest -q

      - name: Service en ligne (défis entre amis)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          python -c "import json, os, re; u, k = os.environ.get('SUPABASE_URL', '').strip(), os.environ.get('SUPABASE_KEY', '').strip(); ok = bool(re.fullmatch(r'https://[a-z0-9]+\.supabase\.co/?', u)) and bool(re.fullmatch(r'[A-Za-z0-9_.-]{20,}', k)); ok and open('app/online_config.json', 'w').write(json.dumps({'url': u, 'key': k})); print('::notice title=Défis en ligne::branchés (secrets SUPABASE trouvés et valides)' if ok else '::warning title=Défis en ligne::secrets SUPABASE absents ou mal recopiés (adresse https://xxx.supabase.co, clé complète sans « … ») : onglet Défis caché')"

      - name: Fabrication de l'app et du .dmg
        run: packaging/build_macos.sh

      - name: Test de l'app empaquetée (serveur, PDF/Word/PowerPoint)
        run: python packaging/smoke_test.py dist/Pirouette.app/Contents/MacOS/Pirouette

      - name: Test de la fenêtre (l'app doit rester ouverte)
        run: |
          dist/Pirouette.app/Contents/MacOS/Pirouette &
          PID=$!
          sleep 25
          screencapture -x fenetre.png || true
          if kill -0 "$PID" 2>/dev/null; then
            echo "✓ La fenêtre Pirouette est ouverte"
            kill "$PID"
          else
            echo "✗ Pirouette s'est fermée au démarrage"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Pirouette-${{ matrix.label }}
          path: dist/*.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-${{ matrix.label }}
          path: fenetre.png
          if-no-files-found: ignore

  windows:
    name: Windows (installateur)
    if: ${{ !github.event.repository.private }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt pytest

      # Pour l'instant à titre d'information : les tests ont été écrits sur Mac et Linux
      - name: Tests (informatif)
        continue-on-error: true
        run: python -m pytest -q

      - name: Service en ligne (défis entre amis)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          python -c "import json, os, re; u, k = os.environ.get('SUPABASE_URL', '').strip(), os.environ.get('SUPABASE_KEY', '').strip(); ok = bool(re.fullmatch(r'https://[a-z0-9]+\.supabase\.co/?', u)) and bool(re.fullmatch(r'[A-Za-z0-9_.-]{20,}', k)); ok and open('app/online_config.json', 'w').write(json.dumps({'url': u, 'key': k})); print('::notice title=Défis en ligne::branchés (secrets SUPABASE trouvés et valides)' if ok else '::warning title=Défis en ligne::secrets SUPABASE absents ou mal recopiés (adresse https://xxx.supabase.co, clé complète sans « … ») : onglet Défis caché')"

      - name: Fabrication de l'app et de l'installateur
        run: packaging/build_windows.ps1

      - name: Test de l'app empaquetée (serveur, PDF/Word/PowerPoint, app Claude)
        run: python packaging/smoke_test.py dist/Pirouette/Pirouette.exe

      - name: Installation silencieuse (comme une mise à jour)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*-Windows-Setup.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $exe = "$env:LOCALAPPDATA\Programs\Pirouette\Pirouette.exe"
          if (-not (Test-Path $exe)) { throw "Pirouette.exe n'a pas été installé" }
          Write-Host "✓ Installé dans $exe"

      - name: Test de la fenêtre (l'app doit rester ouverte)
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "$env:LOCALAPPDATA\Programs\Pirouette\Pirouette.exe" -PassThru
          Start-Sleep -Seconds 30
          if ($app.HasExited) { throw "Pirouette s'est fermée au démarrage (code $($app.ExitCode))" }
          # Une erreur au démarrage laisse aussi le programme ouvert, mais sur une boîte d'erreur : on vérifie que la
          # fenêtre affichée est bien celle de Pirouette.
          $app.Refresh()
          if ($app.MainWindowTitle -ne 'Pirouette') {
            $log = "$env:APPDATA\Pirouette\pirouette.log"
            if (Test-Path $log) { Get-Content $log }
            throw "La fenêtre affichée n'est pas celle de Pirouette : « $($app.MainWindowTitle) »"
          }
          Write-Host "✓ La fenêtre Pirouette est ouverte"
          Stop-Process -Id $app.Id -Force

      - name: Test de la mise à jour (installateur téléchargé, Pirouette quittée → installée puis rouverte)
        # (nouveau test : en cas d'échec, l'installateur Windows est quand même publié ; le résultat se lit dans le run)
        continue-on-error: true
        shell: pwsh
        run: |
          # Comme après « Télécharger la mise à jour » : l'installateur attend dans Pirouette-maj
          $maj = "$env:LOCALAPPDATA\Pirouette-maj"
          New-Item -ItemType Directory -Force -Path $maj | Out-Null
          Copy-Item (Get-ChildItem dist\*-Windows-Setup.exe | Select-Object -First 1).FullName "$maj\Pirouette-Setup.exe"
          $exe = "$env:LOCALAPPDATA\Programs\Pirouette\Pirouette.exe"
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 25
          # On quitte Pirouette (fermeture de la fenêtre) : l'installation doit se faire, puis Pirouette se rouvrir
          $null = $app.CloseMainWindow()
          Start-Sleep -Seconds 5
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          $deadline = (Get-Date).AddSeconds(150)
          while ((Test-Path "$maj\Pirouette-Setup.exe") -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 3 }
          # Le journal du script, lisible dans le résumé du run (annotations)
          $journal = (Get-Content "$maj\installer.log" -ErrorAction SilentlyContinue | Where-Object { $_ -match '\S' -and $_ -notmatch '^\*+$|^(Windows PowerShell|Heure|Start time|Username|RunAs|Configuration|Machine|Host Application|Process ID|PSVersion|PSEdition|PSCompatible|BuildVersion|CLRVersion|WSManStack|PSRemoting|Serialization|End time|Fin de)' }) -join ' | '
          Write-Host "::notice title=Mise à jour Windows (journal)::$journal"
          $fichiers = (Get-ChildItem $maj -Name) -join ', '
          $maj_log = (Get-Content "$maj\update.log" -ErrorAction SilentlyContinue) -join ' | '
          $app_log = (Get-Content "$env:APPDATA\Pirouette\pirouette.log" -Tail 20 -ErrorAction SilentlyContinue) -join ' | '
          Write-Host "::notice title=Mise à jour Windows (fichiers)::$fichiers"
          Write-Host "::notice title=Mise à jour Windows (update.log)::$maj_log"
          Write-Host "::notice title=Mise à jour Windows (pirouette.log)::$app_log"
          if (Test-Path "$maj\Pirouette-Setup.exe") {
            $setup = (Get-Content "$maj\setup.log" -Tail 15 -ErrorAction SilentlyContinue) -join ' | '
            Write-Host "::error title=Mise à jour Windows::l'installateur attend toujours. setup.log : $setup"
            throw "La mise à jour ne s'est pas installée (l'installateur attend toujours)"
          }
          Start-Sleep -Seconds 10
          $again = Get-Process -Name Pirouette -ErrorAction SilentlyContinue
          if (-not $again) { Write-Host "::error title=Mise à jour Windows::installée, mais Pirouette ne s'est pas rouverte"; throw "Pirouette ne s'est pas rouverte" }
          Write-Host "::notice title=Mise à jour Windows::installée puis Pirouette rouverte"
          Write-Host "✓ Mise à jour installée et Pirouette rouverte"
          $again | Stop-Process -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Pirouette-Windows
          path: dist/*-Windows-Setup.exe
          if-no-files-found: error

  release:
    name: Page de téléchargement
    needs: [dmg, windows]
    # Le Mac est publié même si la version Windows a échoué (elle rejoindra la version suivante)
    if: ${{ always() && needs.dmg.result == 'success' }}
    # Même machine que la version Apple Silicon : les étiquettes « ubuntu-latest » puis « macos-latest » sont restées
    # des heures sans machine disponible (publication annulée), alors que macos-14 en trouve tout de suite
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: Pirouette-*
          path: dmg
          merge-multiple: true

      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('app/__init__.py').read()).group(1))")
          TAG="v${VERSION}"
          # Noms sans numéro de version : les liens .../releases/latest/download/… restent valables d'une version à l'autre
          cp dmg/*-Apple-Silicon.dmg Pirouette-Apple-Silicon.dmg
          cp dmg/*-Intel.dmg Pirouette-Intel.dmg
          FILES="Pirouette-Apple-Silicon.dmg Pirouette-Intel.dmg"
          if ls dmg/*-Windows-Setup.exe >/dev/null 2>&1; then
            cp dmg/*-Windows-Setup.exe Pirouette-Windows-Setup.exe
            FILES="$FILES Pirouette-Windows-Setup.exe"
          fi
          # Une version republiée remplace la précédente du même numéro (les nouveautés arrivent sans changer de lien)
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" $FILES \
            --target "$GITHUB_SHA" --title "Pirouette ${VERSION}" \
            --notes-file packaging/RELEASE_NOTES.md --latest
