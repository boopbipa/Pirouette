name: Service en ligne toujours actif

# Le projet Supabase gratuit se met en pause après une semaine sans activité : une petite requête par jour l'en empêche.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Petite requête au service en ligne
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then echo "Pas de secrets : rien à faire"; exit 0; fi
          curl -fsS -o /dev/null -w "Réponse : %{http_code}\n" "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" -H "apikey: $SUPABASE_KEY"
